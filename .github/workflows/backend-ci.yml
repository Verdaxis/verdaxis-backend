# Live branches are staging/prod.
# Deploys are operator-run on the VPS via scripts/deploy.sh.
# See CLAUDE.md for live topology details.

name: Verdaxis Backend CI

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          RELEASE_SHA: test
          JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
        run: DATABASE_URL="sqlite+aiosqlite:///:memory:" pytest tests/unit -q

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt

  postgres-analytics:
    # Product Analytics correctness suite against the deployed database image.
    # SQLite (unit job) is the fast harness; PostgreSQL is the authority.
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.6-alpine@sha256:49b4d46c9fb8b158ddecd14d1894871a21ed4acb7ef376e2050f43f79c7b7272
        env:
          POSTGRES_PASSWORD: analytics-test
          POSTGRES_DB: verdaxis_analytics_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run PostgreSQL analytics tests
        env:
          ENVIRONMENT: test
          RELEASE_SHA: test
          JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
          PGPASSWORD: "analytics-test"
          DATABASE_URL: "postgresql+asyncpg://verdaxis_app_test:analytics-test@localhost:5432/verdaxis_analytics_test"
          MIGRATOR_DATABASE_URL: "postgresql+asyncpg://verdaxis_migrator_test:analytics-test@localhost:5432/verdaxis_analytics_test"
          PRODUCT_ANALYTICS_TEST_DATABASE_URL: "postgresql+asyncpg://verdaxis_migrator_test:analytics-test@localhost:5432/verdaxis_analytics_test"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U postgres -d verdaxis_analytics_test -v ON_ERROR_STOP=1 -c "CREATE EXTENSION IF NOT EXISTS postgis"
          psql -h localhost -U postgres -d verdaxis_analytics_test \
            -v database_name=verdaxis_analytics_test \
            -v app_role=verdaxis_app_test \
            -v migrator_role=verdaxis_migrator_test \
            -v backup_role=verdaxis_backup_test \
            -f deploy/postgres/bootstrap_roles.sql
          psql -h localhost -U postgres -d verdaxis_analytics_test -v ON_ERROR_STOP=1 \
            -c "ALTER ROLE verdaxis_app_test PASSWORD 'analytics-test'; ALTER ROLE verdaxis_migrator_test PASSWORD 'analytics-test'; ALTER ROLE verdaxis_backup_test PASSWORD 'analytics-test';"
          ./scripts/verify_migrations.sh
          psql -h localhost -U postgres -d verdaxis_analytics_test \
            -v database_name=verdaxis_analytics_test \
            -v app_role=verdaxis_app_test \
            -v migrator_role=verdaxis_migrator_test \
            -v backup_role=verdaxis_backup_test \
            -f deploy/postgres/bootstrap_roles.sql
          psql -h localhost -U postgres -d verdaxis_analytics_test \
            -v database_name=verdaxis_analytics_test \
            -v app_role=verdaxis_app_test \
            -v migrator_role=verdaxis_migrator_test \
            -v backup_role=verdaxis_backup_test \
            -f deploy/postgres/validate_roles.sql
          pytest tests/postgres -q
