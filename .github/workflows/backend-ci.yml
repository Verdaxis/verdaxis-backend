# Live branches are staging/prod.
# Deploys are operator-run on the VPS via scripts/deploy.sh.
# See CLAUDE.md for live topology details.

name: Verdaxis Backend CI

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          RELEASE_SHA: test
          JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
        run: DATABASE_URL="sqlite+aiosqlite:///:memory:" pytest tests/unit -q

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt
          pip-audit --strict -r constraints.txt --no-deps

  postgres-analytics:
    # Product Analytics and market correctness suites against the deployed
    # database image. SQLite (unit job) is the fast harness; PostgreSQL is the
    # authority.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Run PostgreSQL correctness tests
        env:
          ENVIRONMENT: test
          RELEASE_SHA: test
          JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
          PYTEST_BIN: pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          ./scripts/run_product_analytics_postgres_tests.sh tests/postgres
