# Live branches are staging/prod.
# Deploys are operator-run on the VPS via scripts/deploy.sh.
# See CLAUDE.md for live topology details.

name: Verdaxis Backend CI

on:
  push:
    branches: [staging, prod]
  pull_request:
    branches: [staging, prod, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      # The same pinned release and digest as the Rust read CI contract job.
      - name: Install Caddy for the required routing tests
        env:
          CADDY_VERSION: "2.11.7"
          CADDY_SHA256: "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b"
        run: |
          curl -fsSL -o caddy.tar.gz \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  caddy.tar.gz\n' "$CADDY_SHA256" | sha256sum -c -
          tar -xzf caddy.tar.gz caddy
          sudo install -m 0755 caddy /usr/local/bin/caddy

      - name: Run unit tests
        env:
          ENVIRONMENT: test
          RELEASE_SHA: test
          JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
        run: DATABASE_URL="sqlite+aiosqlite:///:memory:" pytest tests/unit tests/monitor -q

      - name: Dependency audit
        run: |
          pip install pip-audit
          pip-audit --strict -r requirements.txt
          pip-audit --strict -r constraints.txt --no-deps

  postgres-analytics:
    # Product Analytics and market correctness suites against the deployed
    # database image. SQLite (unit job) is the fast harness; PostgreSQL is the
    # authority.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -c constraints.txt

      - name: Install the pinned Rust toolchain for cache listener integration
        run: |
          channel="$(grep -oP 'channel = "\K[^"]+' rs/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal
          rustup default "$channel"

      - name: Run PostgreSQL correctness tests
        env:
          ENVIRONMENT: test
          RELEASE_SHA: test
          JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
          PYTEST_BIN: pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          ./scripts/run_product_analytics_postgres_tests.sh tests/postgres

  postgres-phase0:
    # Owns tests/phase0 and the three test_phase0_* PostgreSQL suites.
    # The runner owns its pinned PostGIS container and refuses missing coverage.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # Fixture schemas are built from immutable production/staging commits.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m venv venv
          # Rust tests that start Python use this interpreter (RUST_TEST_PYTHON).
          echo "$PWD/venv/bin" >> "$GITHUB_PATH"
          echo "RUST_TEST_PYTHON=$PWD/venv/bin/python" >> "$GITHUB_ENV"
          "$PWD/venv/bin/python" -m pip install --upgrade pip
          "$PWD/venv/bin/python" -m pip install -r requirements.txt -c constraints.txt

      - name: Run Phase 0 PostgreSQL correctness tests
        env:
          ENVIRONMENT: test
          RELEASE_SHA: test
          JWT_SECRET: "test-secret-key-that-is-at-least-32-characters-long"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          bash scripts/run_phase0_postgres_tests.sh
