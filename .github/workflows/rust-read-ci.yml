# Rust read-service CI: build, contract-test, and attest the release artifact.
#
# Live branches are staging/prod. This workflow never deploys and never receives
# staging or production secrets. Each contract-check lane starts its own
# disposable services; no database or server is shared between runners.
#
# Pull requests and manual dispatch run offline and all contract checks. Pushes
# to staging/prod also publish, but only after every check returns exactly
# `success` (not `skipped`). No job runs on every feature-branch push.
#
# Every third-party Action is pinned by full commit SHA; the tag is in a comment
# beside it. SHAs were resolved from the release tags with read-only `gh api`
# calls.

name: Rust read CI

on:
  pull_request:
    branches: [staging, prod, main]
  push:
    branches: [staging, prod]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Both live hosts are x86_64 Linux; staging glibc is 2.35, so the build runs
  # on the oldest of the two and the binary must not need a newer glibc symbol.
  RUST_TARGET: x86_64-unknown-linux-gnu
  LIBC_MIN: "2.35"
  # Caddy is used only by the contract checks. Pin the release and its checksum.
  CADDY_VERSION: "2.11.7"
  # SHA-256 of caddy_2.11.7_linux_amd64.tar.gz as GitHub records it for the release
  # asset (`gh api repos/caddyserver/caddy/releases/tags/v2.11.7`, field `digest`).
  # The release checksums file lists SHA-512 values, which `sha256sum` cannot check.
  CADDY_SHA256: "727b91701a392de6ebc5027509f548bf39979e5216340d0faed8fa5e69c84f8b"
  SQLX_CLI_VERSION: "0.9.0"

jobs:
  # Keep the staging-required check name, with host tooling only.
  test:
    runs-on: ubuntu-22.04
    env:
      ENVIRONMENT: test
      RELEASE_SHA: test
      JWT_SECRET: test-secret-key-for-testing-minimum-32-chars
      DATABASE_URL: "sqlite+aiosqlite:///:memory:"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the tooling test packages with system Python
        # Install into the system site, not the user site: the budget and
        # runtime helpers start `python3 -I`, which ignores the user site.
        # The runtime helper projects the two pinned email-domain datasets.
        run: |
          sudo /usr/bin/python3 -m pip install \
            pytest==9.1.1 pytest-asyncio==1.4.0 python-dotenv==1.2.2 \
            cryptography==50.0.0 httpx==0.28.1 SQLAlchemy==2.0.51 \
            pydantic==2.13.4 pydantic-settings==2.14.2 \
            PyYAML==6.0.3 jsonschema==4.25.1 \
            disposable-email-domains==0.0.225 free-email-domains==1.0.2
      - name: Install the pinned Caddy for tooling routing tests
        shell: bash -euo pipefail {0}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/caddy.tar.gz" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$CADDY_SHA256" "$RUNNER_TEMP/caddy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          sudo install -m 0755 "$RUNNER_TEMP/caddy" /usr/local/bin/caddy
      - name: Run the retained tooling and monitor tests
        run: /usr/bin/python3 -m pytest tests/tooling tests/monitor -q

  phase10-shellcheck:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install ShellCheck 0.10.0
        shell: bash -euo pipefail {0}
        run: |
          # Official v0.10.0 Linux x86_64 release, independently downloaded and hashed.
          curl --fail --location --retry 3 \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            --output "$RUNNER_TEMP/shellcheck.tar.xz"
          printf '%s  %s\n' \
            6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87 \
            "$RUNNER_TEMP/shellcheck.tar.xz" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/shellcheck-v0.10.0" >> "$GITHUB_PATH"
      - name: Check every reviewed shell script
        shell: bash -euo pipefail {0}
        run: |
          [[ "$(shellcheck --version | grep '^version:')" == "version: 0.10.0" ]]
          mapfile -t reviewed_scripts < deploy/tests/shellcheck-files.txt
          (( ${#reviewed_scripts[@]} > 0 ))
          for script in "${reviewed_scripts[@]}"; do bash -n "$script"; done
          shellcheck --severity=style --external-sources "${reviewed_scripts[@]}"
      - name: Run the disposable artifact contract
        shell: bash -euo pipefail {0}
        run: |
          python3 -m venv "$RUNNER_TEMP/artifact-test-venv"
          "$RUNNER_TEMP/artifact-test-venv/bin/pip" install cryptography==50.0.0 PyYAML==6.0.3 jsonschema==4.25.1
          ARTIFACT_TEST_PYTHON="$RUNNER_TEMP/artifact-test-venv/bin/python" bash deploy/tests/artifact-contract.sh
      - name: Run the Python-free deploy transaction harness
        shell: bash -euo pipefail {0}
        run: bash deploy/tests/deploy-transaction.sh
      - name: Run the Python-free unit installer contract
        shell: bash -euo pipefail {0}
        run: bash deploy/tests/units-contract.sh --static

  offline:
    runs-on: ubuntu-22.04
    env:
      SQLX_OFFLINE: "true"
      RUST_TEST_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install retained host-tooling helper packages
        run: |
          sudo /usr/bin/python3 -m pip install \
            python-dotenv==1.2.2 disposable-email-domains==0.0.225 free-email-domains==1.0.2
      - name: Install the pinned Rust toolchain
        shell: bash -euo pipefail {0}
        run: |
          channel="$(grep -oP 'channel = "\K[^"]+' rs/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rs -> target
          key: offline-${{ env.RUST_TARGET }}-${{ hashFiles('rs/rust-toolchain.toml', 'rs/Cargo.lock') }}
          # Only stable build inputs affect the key; RELEASE_SHA must not.
          env-vars: RUST_TARGET SQLX_OFFLINE CARGO_INCREMENTAL

      - name: Check dependency advisories
        working-directory: rs
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit
      - name: Fetch locked dependencies
        run: cargo fetch --manifest-path rs/Cargo.toml --locked
      - name: Check that every Rust test file is in a test binary
        run: python3 scripts/check_test_groups.py
      - name: Run the whole offline Rust workspace
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: cargo test --manifest-path rs/Cargo.toml --locked --workspace --no-fail-fast
      - name: Check formatting and both feature configurations
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cargo fmt --manifest-path rs/Cargo.toml --all -- --check
          cargo clippy --manifest-path rs/Cargo.toml --locked --workspace --all-targets -- -D warnings
          cargo clippy --manifest-path rs/Cargo.toml --locked --workspace --all-targets --features verdaxis-read/contract-tests -- -D warnings

  # Build in parallel with tests. Release output is never restored from cache.
  release:
    runs-on: ubuntu-22.04
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install the pinned Rust toolchain
        shell: bash -euo pipefail {0}
        run: |
          channel="$(grep -oP 'channel = "\K[^"]+' rs/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rs -> target
          key: release-${{ env.RUST_TARGET }}-${{ hashFiles('rs/rust-toolchain.toml', 'rs/Cargo.lock') }}
          # Only stable build inputs affect the key; RELEASE_SHA must not.
          env-vars: RUST_TARGET SQLX_OFFLINE CARGO_INCREMENTAL
          cache-targets: "false"

      - name: Build the release artifact for the host target
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          cargo build --manifest-path rs/Cargo.toml --locked --release \
            --target "$RUST_TARGET" -p verdaxis-read
          sha256sum "rs/target/$RUST_TARGET/release/verdaxis-read"

      - name: Run the full host-automation installer and identity contracts
        shell: bash -euo pipefail {0}
        run: |
          VERDAXIS_READ_BIN="$PWD/rs/target/$RUST_TARGET/release/verdaxis-read" \
            bash deploy/tests/units-contract.sh

      - name: Check the glibc floor of the built binary
        shell: bash
        run: |
          command -v objdump >/dev/null || sudo apt-get install -y -qq binutils
          objdump -T "rs/target/$RUST_TARGET/release/verdaxis-read" > objdump-symbols.txt
          python3 scripts/verify_rust_artifact.py --glibc-check \
            --objdump objdump-symbols.txt --max "$LIBC_MIN" \
            --source-sha "$GITHUB_SHA" \
            | tee glibc-report.txt

      - name: Package the release artifact
        shell: bash
        run: |
          mkdir -p release
          cp "rs/target/$RUST_TARGET/release/verdaxis-read" release/verdaxis-read
          # Keep every uploaded file under release/, so the artifact root is release/
          # and both download steps (path: release) find release/<file>.
          cp glibc-report.txt release/glibc-report.txt
          python3 scripts/verify_rust_artifact.py --package \
            --binary release/verdaxis-read \
            --data-dir deploy/rust \
            --lockfile rs/Cargo.lock \
            --toolchain "$(grep -oP 'channel = "\K[^"]+' rs/rust-toolchain.toml)" \
            --source-sha "$GITHUB_SHA" \
            --target "$RUST_TARGET" \
            --output "release/verdaxis-read-$GITHUB_SHA.tar" \
            --metadata-out release/artifact-metadata.json

      - name: Upload the release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-read-artifact
          if-no-files-found: error
          retention-days: 7
          path: |
            release/verdaxis-read
            release/verdaxis-read-*.tar
            release/artifact-metadata.json
            release/glibc-report.txt

  # No timing-balanced split is claimed: run_postgres.sh alone took 23m14s
  # before failing in the measured run; the other ten runners never started.
  postgres:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          # run_postgres.sh builds its databases in every shard and then runs
          # only the named groups; each of its four groups runs in one shard.
          - shard: workspace
            runners: run_postgres.sh
            postgres_groups: workspace
          - shard: market-settlement
            runners: run_postgres.sh
            postgres_groups: market_settlement
          - shard: market-orders
            runners: run_postgres.sh
            postgres_groups: market_orders
          - shard: schema
            runners: run_postgres.sh
            postgres_groups: schema
          - shard: authority
            runners: run_phase4_authority.sh run_phase10_reminders.sh run_abilities.sh run_phase10_inspect.sh run_feedback.sh
          - shard: account
            runners: run_offboarding_schema.sh run_offboarding_admission.sh run_offboarding_credentials.sh run_offboarding_command.sh run_compliance_scores.sh run_phase5_bounds.sh
          - shard: market
            runners: run_offboarding_market.sh run_offboarding_composition.sh run_offboarding_acceptance.sh run_market_contract.sh
          # Market-write component cases (cancel, commission, contexts,
          # effects, match completion, post-only, stock, suggestions).
          - shard: market-write
            runners: run_market_write_components.sh
          # Auth, stream, public-cache and alert targets that read their own
          # database variables and run only against a seeded disposable database.
          - shard: components
            runners: run_auth_streams_cache.sh
    env:
      SQLX_OFFLINE: "true"
      RUST_TEST_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install retained host-tooling helper packages
        run: |
          sudo /usr/bin/python3 -m pip install \
            python-dotenv==1.2.2 disposable-email-domains==0.0.225 free-email-domains==1.0.2
      - name: Install the pinned Rust toolchain
        shell: bash -euo pipefail {0}
        run: |
          channel="$(grep -oP 'channel = "\K[^"]+' rs/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rs -> target
          key: postgres-${{ matrix.shard }}-${{ env.RUST_TARGET }}-${{ hashFiles('rs/rust-toolchain.toml', 'rs/Cargo.lock') }}
          # Only stable build inputs affect the key; RELEASE_SHA must not.
          env-vars: RUST_TARGET SQLX_OFFLINE CARGO_INCREMENTAL

      # A slow apt mirror once held this step for over 20 minutes. Each apt
      # command has its own time limit, and the step tries three times.
      - name: Install the PostgreSQL client
        timeout-minutes: 12
        shell: bash -euo pipefail {0}
        run: |
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30)
          for attempt in 1 2 3; do
            if sudo timeout 90 apt-get "${apt_options[@]}" update -qq &&
              sudo timeout 120 apt-get "${apt_options[@]}" install -y -qq postgresql-client; then
              exit 0
            fi
            echo "PostgreSQL client install attempt $attempt failed" >&2
            sleep 10
          done
          exit 1
      - name: Run every runner in this explicit shard
        shell: bash -euo pipefail {0}
        env:
          RELEASE_SHA: ${{ github.sha }}
          RUNNERS: ${{ matrix.runners }}
          RUN_POSTGRES_GROUPS: ${{ matrix.postgres_groups }}
        run: |
          status=0
          for runner in $RUNNERS; do
            printf '\nRunning %s\n' "$runner"
            if bash "rs/read/tests/$runner"; then
              printf 'PASS %s\n' "$runner"
            else
              printf 'FAIL %s\n' "$runner"
              status=1
            fi
          done
          exit "$status"

  # Preserve the staging-required name and fail on failed or skipped shards.
  postgres-analytics:
    needs: postgres
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require every PostgreSQL shard
        env:
          RESULT: ${{ needs.postgres.result }}
        run: test "$RESULT" = success

  native-checks:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        check: [sqlx, caddy]
    env:
      SQLX_OFFLINE: "true"
      RUST_TEST_PYTHON: /usr/bin/python3
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install the pinned Rust toolchain
        shell: bash -euo pipefail {0}
        run: |
          channel="$(grep -oP 'channel = "\K[^"]+' rs/rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          rustup default "$channel"
          rustup show

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rs -> target
          key: native-${{ matrix.check }}-${{ env.RUST_TARGET }}-${{ hashFiles('rs/rust-toolchain.toml', 'rs/Cargo.lock') }}
          # Only stable build inputs affect the key; RELEASE_SHA must not.
          env-vars: RUST_TARGET SQLX_OFFLINE CARGO_INCREMENTAL

      - name: Install sqlx-cli
        if: matrix.check == 'sqlx'
        run: |
          if ! command -v sqlx >/dev/null; then
            cargo install sqlx-cli --version "$SQLX_CLI_VERSION" --locked \
              --no-default-features --features postgres,rustls
          fi
      - name: Validate SQLx metadata against a disposable baseline
        if: matrix.check == 'sqlx'
        shell: bash -euo pipefail {0}
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          container=''
          trap 'if [[ -n "$container" ]]; then docker rm -f -v "$container" >/dev/null; fi' EXIT
          container=$(docker run -d --rm -e POSTGRES_PASSWORD=disposable_pw \
            -e POSTGRES_DB=verdaxis_sqlx_test -p 127.0.0.1::5432 \
            postgis/postgis:17-3.6-alpine@sha256:49b4d46c9fb8b158ddecd14d1894871a21ed4acb7ef376e2050f43f79c7b7272)
          for _ in {1..90}; do
            if docker exec "$container" pg_isready -U postgres >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec "$container" pg_isready -U postgres
          port=$(docker port "$container" 5432/tcp)
          port=${port##*:}
          export DATABASE_URL="postgres://postgres:disposable_pw@127.0.0.1:$port/verdaxis_sqlx_test"
          cd rs || exit 1
          cargo sqlx migrate run --source read/migrations
          SQLX_OFFLINE=false cargo sqlx prepare --check --workspace
      - name: Install the pinned Caddy
        if: matrix.check == 'caddy'
        shell: bash -euo pipefail {0}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/caddy.tar.gz" \
            "https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}/caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          printf '%s  %s\n' "$CADDY_SHA256" "$RUNNER_TEMP/caddy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/caddy.tar.gz" -C "$RUNNER_TEMP" caddy
          install -D -m 0755 "$RUNNER_TEMP/caddy" "$RUNNER_TEMP/bin/caddy"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Run the offboarding routing test against the pinned Caddy
        if: matrix.check == 'caddy'
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
          SQLX_OFFLINE: "true"
        run: |
          set -o pipefail
          CADDY_BINARY="$RUNNER_TEMP/bin/caddy" cargo test --manifest-path rs/Cargo.toml --locked \
            -p verdaxis-read --test group_offboarding \
            -- --ignored --exact offboarding_composition::caddy_routes_the_group_only_when_enabled 2>&1 | tee offboarding-caddy.log
          grep -Eq '^test result: ok\. 1 passed; 0 failed' offboarding-caddy.log


  artifact-check:
    needs: release
    runs-on: ubuntu-22.04
    steps:
      - name: Download the release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-read-artifact
          path: release
      - name: Test the release binary identity
        shell: bash
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          chmod +x release/verdaxis-read
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          binary = Path("release/verdaxis-read")
          metadata = json.loads(Path("release/artifact-metadata.json").read_text())
          digest = hashlib.sha256(binary.read_bytes()).hexdigest()
          assert digest == metadata["binary"]["sha256"], "binary digest differs from metadata"
          assert metadata["release_sha"] == os.environ["RELEASE_SHA"], "metadata source SHA differs"
          document = json.loads(subprocess.run([str(binary), "--version-json"], check=True,
                                               capture_output=True, text=True).stdout)
          assert document["release_sha"] == os.environ["RELEASE_SHA"], "compiled identity differs"
          assert document["libc_min"] == metadata["libc_min"], "libc floor differs"
          report = {"release_sha": os.environ["RELEASE_SHA"], "binary_sha256": digest,
                    "version_json": document, "metadata_sha256": hashlib.sha256(
                        Path("release/artifact-metadata.json").read_bytes()).hexdigest()}
          Path("tested-binary.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          print("TESTED " + json.dumps({"binary_sha256": digest}))
          PY

      - name: Upload the tested binary identity
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-tested-binary
          if-no-files-found: error
          retention-days: 7
          path: tested-binary.json

  # Publication requires every retained check, not only a green aggregate.
  contract:
    needs: [test, phase10-shellcheck, offline, release, native-checks, postgres-analytics, artifact-check]
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Require every native and tooling check to succeed
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          results = json.loads(os.environ["CHECK_RESULTS"])
          failed = [name for name, result in results.items() if result["result"] != "success"]
          assert not failed, f"checks did not succeed: {failed}"
          PY
      - name: Download the tested binary identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-tested-binary
          path: contract-evidence
      - name: Record the native check results
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          results = json.loads(os.environ["CHECK_RESULTS"])
          report = {"source_sha": os.environ["GITHUB_SHA"], "checks": results,
                    "failed_groups": [name for name, item in results.items() if item["result"] != "success"]}
          Path("contract-evidence/ci-contract.json").write_text(json.dumps(report, indent=2, sort_keys=True) + "\n")
          PY
      - name: Upload the contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-contract-evidence
          if-no-files-found: error
          retention-days: 7
          path: contract-evidence/

  # Publish attests the exact binary digest the native artifact lane tested,
  # only after every retained check and the aggregate succeed.
  publish:
    needs: [release, contract]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/prod') &&
      needs.release.result == 'success' &&
      needs.contract.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Download the release artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-read-artifact
          path: release

      - name: Download the contract evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rust-contract-evidence
          path: evidence

      - name: Require the tested digest to be the published digest
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          tested = json.loads(Path("evidence/tested-binary.json").read_text())
          digest = hashlib.sha256(Path("release/verdaxis-read").read_bytes()).hexdigest()
          # The attestation subject must be the bytes the contract job executed.
          assert tested["binary_sha256"] == digest, "published binary is not the tested binary"
          report = json.loads(Path("evidence/ci-contract.json").read_text())
          assert report["source_sha"] == tested["release_sha"], "contract report source differs"
          assert not report["failed_groups"], "contract gate reported failures"
          print("PUBLISHING " + digest)
          PY

      - name: Package the release bundle
        shell: bash
        run: |
          tar --owner=root --group=root --mtime=@0 \
            -cf "rust-read-release-$GITHUB_SHA.tar" \
            release/verdaxis-read \
            release/verdaxis-read-*.tar \
            release/artifact-metadata.json \
            release/glibc-report.txt \
            evidence/ci-contract.json \
            evidence/tested-binary.json
          sha256sum "rust-read-release-$GITHUB_SHA.tar"

      # Attest both the binary the contract job tested and the archive that
      # carries it, so the workstation can verify the binary digest directly.
      - name: Attest the release artifact
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            release/verdaxis-read
            release/verdaxis-read-*.tar

      - name: Upload the release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rust-read-release
          if-no-files-found: error
          retention-days: 30
          path: |
            rust-read-release-*.tar
            release/verdaxis-read
            release/verdaxis-read-*.tar
            release/artifact-metadata.json
            evidence/ci-contract.json
            evidence/tested-binary.json
