# Verdaxis production host (decision 203): restart the PostgreSQL 17 cluster
# when its postmaster exits abnormally (for example after the out-of-memory
# killer). PostgreSQL restarts its own crashed backends; this covers the
# postmaster itself, which the distribution unit leaves down (Restart=no).
# Install as /etc/systemd/system/postgresql@17-main.service.d/10-verdaxis-restart.conf,
# then `systemctl daemon-reload`; no restart is needed for the setting to apply.
[Service]
Restart=on-failure
RestartSec=5s
