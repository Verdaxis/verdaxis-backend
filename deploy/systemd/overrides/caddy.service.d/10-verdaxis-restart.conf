# Verdaxis production host (decision 203): restart Caddy when it exits
# abnormally. The distribution unit has Restart=no, so a crash would leave the
# whole site down until an operator acts. Install as
# /etc/systemd/system/caddy.service.d/10-verdaxis-restart.conf, then
# `systemctl daemon-reload`; no restart is needed for the setting to apply.
[Service]
Restart=on-failure
RestartSec=5s
