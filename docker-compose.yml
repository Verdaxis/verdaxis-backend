services:
  postgres:
    image: postgis/postgis:17-3.6-alpine@sha256:49b4d46c9fb8b158ddecd14d1894871a21ed4acb7ef376e2050f43f79c7b7272
    container_name: verdaxis-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-verdaxis_app} -d ${DATABASE_NAME:-verdaxis}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - verdaxis-net
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    container_name: verdaxis-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis_data:/data
    networks:
      - verdaxis-net
    deploy:
      resources:
        limits:
          memory: 128M

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verdaxis-backend
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - verdaxis-net
    deploy:
      resources:
        limits:
          memory: 768M

volumes:
  postgres_data:
  redis_data:

networks:
  verdaxis-net:
    driver: bridge
