services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: verdaxis-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - verdaxis-net

  redis:
    image: docker.io/library/redis:alpine
    container_name: verdaxis-redis
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - redis_data:/data
    networks:
      - verdaxis-net

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: verdaxis-backend
    restart: always
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - verdaxis-net

  frontend:
    build:
      context: ../verdaxis-frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://144.126.151.136:8000/api
        - VITE_AUTHENTIK_URL=http://144.126.151.136:9000
        - VITE_AUTHENTIK_CLIENT_ID=verdaxis-client-id
    container_name: verdaxis-frontend
    restart: always
    ports:
      - "5173:80"
    env_file: ../verdaxis-frontend/.env
    networks:
      - verdaxis-net
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  verdaxis-net:
    driver: bridge
