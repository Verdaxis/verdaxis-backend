# Reviewed shadow-harness template (Task 14a). Copy to work/rust-phase1/staging.toml
# and fill in the loopback URLs the operator deployed. Never put a secret here:
# the harness carries no credential, and no field below is a token or password.
#
# This file is a template only. No command in Task 14a runs it, and no pass in
# Task 14a touches the staging or production host.

# Loopback targets on the staging host. Production hosts are refused.
python_url = "http://127.0.0.1:8001"
rust_url = "http://127.0.0.1:8011"

# Three upstream calls per ten seconds: one Python-Rust-Python sandwich.
sampling_calls_per_ten_seconds = 3
per_call_deadline_seconds = 2.0
max_response_bytes = 1048576

# Sanitized diagnostics and the aggregate summary are written under this folder.
output_dir = "work/rust-phase1/shadow"

# The harness stops while deploy state exists, including a dangling symlink.
deploy_state_path = "/home/verdaxis-prod/verdaxis/staging/be/.runtime-deploy/staging.state"

# Any 429/503 or readiness failure pauses the harness for this many seconds.
pause_seconds = 60

# A route below this many stable pairs is reported inconclusive, never a pass.
required_observations_per_route = 1000

# Identity of the candidate under test. The operator copies these from the
# reviewed release record, not from the harness.
candidate_sha = ""
policy_hash = ""

# Route minute limits the harness honours; the shadow traffic stays under them.
[limits]
prices_per_minute = 60
reference_per_minute = 30
export_per_minute = 10
