[package]
name = "verdaxis-read"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
# Each test target links the whole crate and its dependencies, so the test
# files are compiled into a few group binaries instead of one binary per file.
# The [[test]] tables below list every target; scripts/check_test_groups.py
# fails when a test file is in no target or in more than one.
autotests = false

# Group binaries: each tests/group_*.rs includes existing test files as modules.
[[test]]
name = "group_auth"

[[test]]
name = "group_crud"

[[test]]
name = "group_market_reads"

[[test]]
name = "group_market_write"

[[test]]
name = "group_offboarding"

[[test]]
name = "group_phase4_phase5"

[[test]]
name = "group_phase10"

[[test]]
name = "group_runtime"

[[test]]
name = "group_streams"

# The test files below stay in their own binaries. Each compiles source
# modules by path whose `crate::` paths name items of the test file root, so
# the file must be a crate root.
[[test]]
name = "auth_email_verification"

[[test]]
name = "auth_email_verification_postgres"

[[test]]
name = "auth_invitation_accept"

[[test]]
name = "auth_invitation_accept_postgres"

[[test]]
name = "auth_logout"

[[test]]
name = "auth_password_change"

[[test]]
name = "auth_password_reset"

[[test]]
name = "auth_password_reset_postgres"

[[test]]
name = "auth_refresh"

[[test]]
name = "auth_refresh_postgres"

[[test]]
name = "auth_registration"

[[test]]
name = "auth_stream"

[[test]]
name = "market_write_decimal"

[[test]]
name = "market_write_properties"

[[test]]
name = "phase4_analytics_facts"

[[test]]
name = "phase4_analytics_legacy"

[[test]]
name = "phase4_analytics_usage"

[[test]]
name = "phase4_analytics_views"

[[test]]
name = "phase4_invitations"

[[test]]
name = "phase4_kyc_review"

[[test]]
name = "phase4_operator_reads"

[[test]]
name = "phase4_organizations"

[[test]]
name = "phase4_profile"

[[test]]
name = "phase4_umami"

[[test]]
name = "phase4_vessels"

[[test]]
name = "phase5_authenticated_boundary"

[[test]]
name = "phase5_availability"

[[test]]
name = "phase5_benchmarks"

[[test]]
name = "phase5_compliance_overlay"

[[test]]
name = "phase5_compliance_scores"

[[test]]
name = "phase5_demand"

[[test]]
name = "phase5_fleet"

[[test]]
name = "phase5_postgres"

[[test]]
name = "phase5_producers"

# Phase 4 Task 13: three offline cases run in every workspace test; the
# PostgreSQL cases inside the file are feature-gated by contract-tests. It also
# compiles source modules by path, as above.
[[test]]
name = "phase4_subscriptions"
path = "tests/phase4_subscriptions.rs"

# Compiles source modules by path, as above.
[[test]]
name = "phase4_analytics_policy"

# Starts a copy of its own test binary with `--exact <test name>`; in a group
# binary the test name gains a module prefix.
[[test]]
name = "auth_registration_postgres"

[[test]]
name = "phase10_alert"

# Starts a copy of its own binary with `--exact <test name>` and reads the
# peak memory of that whole process.
[[test]]
name = "phase10_backup"

# Installs a process-wide tracing subscriber.
[[test]]
name = "phase4_kyc_policy"

# Sets and removes the PGHOST process environment variable.
[[test]]
name = "phase10_outbox"

[[example]]
name = "contract_server"
required-features = ["contract-tests"]

[[example]]
name = "phase2_transport"
required-features = ["contract-tests"]

[[example]]
name = "watchlist_server"
required-features = ["contract-tests"]

[[example]]
name = "phase3_auth"
required-features = ["contract-tests"]

[[example]]
name = "preauth_server"
required-features = ["contract-tests"]

[[example]]
name = "streams_fixture"
required-features = ["contract-tests"]

[features]
contract-tests = []

[dev-dependencies]
proptest = { version = "=1.12.0", default-features = false, features = ["std"] }
verdaxis-contract = { path = "../contract" }
# Paused time lets the stream tests cross 30-second heartbeat intervals at once.
tokio = { version = "1.53.3", features = ["full", "test-util"] }

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
multer = "=3.1.0"
zeroize = "=1.9.1"
icu_casemap = "=2.3.0"
# Phase 2 Task 19: bounded invite provider and EmailStr NFC normalization (start)
reqwest = { version = "=0.13.5", features = ["json"] }
unicode-normalization = "=0.1.25"
# Phase 2 Task 19: bounded invite provider and EmailStr NFC normalization (end)
axum = "0.8"
# Phase 3 Task 4: the auth HTTP boundary reads and writes the session cookies
# with one parser (plan section 5). `cookie` is the time type of cookie
# attributes; axum-extra uses the same version.
axum-extra = { version = "=0.12.6", features = ["cookie"] }
# Phase 3 Task 3: token issuance and password primitives (plan sections 5-6).
base64 = "=0.23.1"
bcrypt = "=0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "=4.6.7", features = ["derive"] }
cookie = "0.18"
# Phase 10 Task 11: RSS, Atom and RDF parsing for the news refresh job.
feed-rs = "=3.0.0"
# Phase 10 Task 27: streaming gzip reads for the backup monitor (pure Rust backend).
flate2 = "=1.1.10"
futures-util = "0.3"
getrandom = "=0.4.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
# Phase 10 Task 3: O_NOFOLLOW/O_CLOEXEC for private state and lock paths.
libc = "0.2.190"
num-bigint = "0.4"
num-traits = "0.2"
percent-encoding = "2.3.2"
rmcp = { version = "3.9", features = ["server", "transport-streamable-http-server"] }
rust_decimal = "1.43.0"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha1 = "=0.11.0"
sha2 = "0.11.1"
# Phase 10 Task 9: the python-dotenv grammar of the deployed .env reader
# (already in Cargo.lock through sqlx).
regex = "1.13.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal", "chrono", "uuid", "macros", "json", "migrate"] }
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
utoipa = "6.0.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
