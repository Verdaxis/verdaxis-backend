[package]
name = "verdaxis-read"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[test]]
name = "runtime_postgres"
required-features = ["contract-tests"]

[[test]]
name = "admission_postgres"
required-features = ["contract-tests"]

[[test]]
name = "market_contract_postgres"
required-features = ["contract-tests"]

[[example]]
name = "contract_server"
required-features = ["contract-tests"]

[[example]]
name = "phase2_transport"
required-features = ["contract-tests"]

[features]
contract-tests = []

[dev-dependencies]
verdaxis-contract = { path = "../contract" }

[dependencies]
axum = "0.8"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "=4.6.7", features = ["derive"] }
futures-util = "0.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
num-bigint = "0.4"
num-traits = "0.2"
percent-encoding = "2.3.2"
rmcp = { version = "3.5.1", features = ["server", "transport-streamable-http-server"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal", "chrono", "uuid", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
utoipa = "6.0.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
