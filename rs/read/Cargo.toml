[package]
name = "verdaxis-read"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[test]]
name = "runtime_postgres"
required-features = ["contract-tests"]

[[test]]
name = "admission_postgres"
required-features = ["contract-tests"]

[[test]]
name = "market_contract_postgres"
required-features = ["contract-tests"]

# Phase 4 Task 13: three offline cases run in every workspace test; the
# PostgreSQL cases inside the file are feature-gated by contract-tests.
[[test]]
name = "phase4_subscriptions"
path = "tests/phase4_subscriptions.rs"

# Phase 4 Task 21: the integrated race suite; its PostgreSQL cases are
# feature-gated by contract-tests.
[[test]]
name = "phase4_races"
path = "tests/phase4_races.rs"
required-features = ["contract-tests"]

[[example]]
name = "contract_server"
required-features = ["contract-tests"]

[[example]]
name = "phase2_transport"
required-features = ["contract-tests"]

[[example]]
name = "watchlist_server"
required-features = ["contract-tests"]

[features]
contract-tests = []

[[test]]
name = "phase4_analytics_policy"

[dev-dependencies]
verdaxis-contract = { path = "../contract" }

[dependencies]
aes-gcm = { version = "=0.11.1", features = ["zeroize"] }
multer = "=3.1.0"
zeroize = "=1.9.1"
icu_casemap = "=2.3.0"
# Phase 2 Task 19: bounded invite provider and EmailStr NFC normalization (start)
reqwest = { version = "=0.13.5", features = ["json"] }
unicode-normalization = "=0.1.25"
# Phase 2 Task 19: bounded invite provider and EmailStr NFC normalization (end)
axum = "0.8"
# Phase 3 Task 4: the auth HTTP boundary reads and writes the session cookies
# with one parser (plan section 5). `cookie` is the time type of cookie
# attributes; axum-extra uses the same version.
axum-extra = { version = "=0.12.6", features = ["cookie"] }
# Phase 3 Task 3: token issuance and password primitives (plan sections 5-6).
base64 = "=0.23.1"
bcrypt = "=0.19.3"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
cookie = "0.18"
futures-util = "0.3"
getrandom = "=0.4.3"
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
num-bigint = "0.4"
num-traits = "0.2"
percent-encoding = "2.3.2"
rmcp = { version = "3.5.1", features = ["server", "transport-streamable-http-server"] }
rust_decimal = "1.43.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "0.11.1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "rust_decimal", "chrono", "uuid", "macros"] }
tokio = { version = "1.53.3", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
url = "2.5.8"
utoipa = "6.0.0"
uuid = { version = "1.28.0", features = ["serde", "v4"] }
