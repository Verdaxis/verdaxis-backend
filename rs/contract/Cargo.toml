[package]
name = "verdaxis-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
# Retained for callers that still select this feature; the package now has
# only independent performance gate tests with fixed inputs.
contract-http = []

[dependencies]
sha2 = "0.11.1"
chrono = "0.4.44"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
