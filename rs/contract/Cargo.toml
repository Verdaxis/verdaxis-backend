[package]
name = "verdaxis-contract"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
# The HTTP contract group tests drive external processes, so they stay behind
# their own feature. The read package's `contract-tests` feature covers the
# PostgreSQL runtime and admission targets, which the disposable PostgreSQL
# runner starts without any contract URLs.
contract-http = []

[[test]]
name = "health"
required-features = ["contract-http"]

[[test]]
name = "echo"
required-features = ["contract-http"]

[dependencies]
sha2 = "0.11.1"
chrono = "0.4.44"
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
