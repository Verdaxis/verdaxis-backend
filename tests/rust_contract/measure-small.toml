# Task 14a measurement configuration (test host only).
# The measurement runs one disposable environment per size, seeds the workload
# manifest's rows, then runs four-worker Python and one Rust process over the
# identical offered load. No staging or production host is involved.
#
# Time budget: the whole task must fit inside four hours of test-host run
# time. With warmup 30 s and windows 30 s @ 1 RPS + 60 s @ 5 RPS +
# 1,800 s @ 10 RPS, one cell is 32 minutes and the four cells (two sizes,
# two runtimes) are about 2 h 8 m, leaving room for the two seeds, the
# migrations and the release build. A route whose declared weight is 1
# receives about 611 observations, below the 1,000 floor; it is reported
# inconclusive with the number still needed rather than claimed as a pass.
# Every route with weight 2 or more reaches the floor.

size = "small"

warmup_seconds = 30
repetitions = 1

[[windows]]
seconds = 30
rps = 1

[[windows]]
seconds = 60
rps = 5

[[windows]]
seconds = 1800
rps = 10
