# Fixture CI: pre-deletion state. The unit job still imports the application.
name: Fixture Backend CI
on: [push]
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -r requirements.txt
      - run: pytest tests/unit -q
      - run: uvicorn app.main:app --help > /dev/null
