# Phase 10 Task 34: the one final measurement (plan 10.6, after cutover only).
#
# This config is the offline declaration of the single allowed run. The run
# itself happens later, on the reserved prod test host, inside the exclusive
# `heavy measure` reservation, after the signed post-deletion inventory
# (Task 33) exists. Nothing here starts a service, touches a deploy state
# path or generates load on its own: the retained tool replays the frozen
# schedule against the pinned seed, then reports.
#
# Schedule: one repetition, the retained tool's 15-second warmup at 5 RPS,
# then 15 seconds at 1 RPS and 900 seconds at 5 RPS — the exact frozen
# small-size schedule. The 60-second 1/5/10/20 RPS capacity ramp runs in the
# same invocation, separately tagged, and never enters comparison windows.

size = "small"
weight_key = "weight_baseline"
report_only = true
requires_cutover_complete = true
cutover_evidence = "signed post-deletion host inventory (Task 33)"
reservation = "exclusive `heavy measure` reservation; owner, start and end recorded in the private evidence root"

# The pinned workload and seed identity. The seed file carries the frozen
# request order; the config carries its digest so a changed seed is refused.
seed = "tests/rust_contract/phase10/measure-seed.json"
seed_sha256 = "3a0a0c0b8d97b544a37a6972295aec4467eaa908ac69c93e39473f1ede2aed7a"

# Digest-pinned Python memory evidence. The placeholders below make the tool
# refuse with a clear message until the real attested digests are recorded.
python_memory_baseline = "tests/rust_contract/phase10/python-memory-baseline.json"

# Frozen baseline pin (decision 87), unchanged.
baseline_sha256 = "3c74f7960add211757198149241f1633ef90a165ec89a902ac40bf79c1f8ea5e"

# Declared service resources, recorded from the frozen baseline manifest and
# the effective systemd properties before the run; a mismatch invalidates the
# comparison.
resources = "16 admission slots / 17 connections, declared session time zone, baseline service CPU/memory limits"

warmup_seconds = 15
repetitions = 1

[[windows]]
seconds = 15
rps = 1

[[windows]]
seconds = 900
rps = 5

# Capacity ramp: separately tagged, stopped at more than 1% non-503 errors or
# 256 MiB peak RSS; ramp samples never enter comparison percentiles.
[[ramp_windows]]
seconds = 60
rps = 1

[[ramp_windows]]
seconds = 60
rps = 5

[[ramp_windows]]
seconds = 60
rps = 10

[[ramp_windows]]
seconds = 60
rps = 20
